<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>土地法與稅法・案例邏輯課本</title>
<!-- PWA：可加到手機主畫面、全螢幕開啟、離線複習 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a5a2b">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="土地法課本">
<style>
  :root{
    --paper:#fbf9f4; --ink:#2a2724; --sub:#8a7f70; --line:#e7e0d4;
    --brand:#8a5a2b; --brand2:#b07a3c; --accent:#3b5bdb;
    --ok:#16a34a; --trap:#e5197f; --sidebar:#f3efe6; --mark-bg:transparent;
    --card:#ffffff; --card2:#fdfcf9; --th:#efe8da; --hover:#ece6d9;
    --h3:#5c4326; --bq:#4a4038; --btn:#efe8da; --btnh:#e6ddcc; --strong:#e5197f;
    --xlaw:#0e7c7b; --xlaw-bg:#e7f4f3; --xlaw-ink:#0b5f5e;
  }
  /* 🌙 暖黑護眼模式（標題維持金色，內文【】重點＋粗體＝珊瑚粉紅） */
  body.dark{
    --paper:#14120d; --ink:#e9e3d5; --sub:#9a8f7d; --line:#332e25;
    --brand:#e0aa63; --brand2:#c9924a; --accent:#8fb0ff;
    --trap:#ff6f91; --sidebar:#1b1811;
    --card:#1c1912; --card2:#191610; --th:#262117; --hover:#26211a;
    --h3:#d8b483; --bq:#d8d0c0; --btn:#26211a; --btnh:#2f2920; --strong:#ff6f91;
    --xlaw:#4fd0c9; --xlaw-bg:#14201f; --xlaw-ink:#8fe6df;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink);
    display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
  /* 目錄 */
  #toc{width:290px;flex:0 0 290px;background:var(--sidebar);border-right:1px solid var(--line);overflow-y:auto;padding:16px 0}
  #toc .bk{padding:0 20px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
  #toc .bk h1{font-size:16px;margin:0 0 3px;letter-spacing:.5px;color:var(--brand)}
  #toc .bk small{color:var(--sub);font-size:11.5px}
  #toc .subjtabs{display:flex;gap:6px;padding:14px 14px 6px;flex-wrap:wrap}
  #toc .subjtab{flex:1;min-width:118px;padding:9px 8px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer}
  #toc .subjtab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  #toc .grp{font-size:11px;color:var(--sub);padding:14px 20px 4px;letter-spacing:1.5px;font-weight:700}
  #toc a{display:block;padding:8px 20px 8px 22px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.5;cursor:pointer;border-left:3px solid transparent}
  #toc a:hover{background:var(--hover)}
  #toc a.on{border-left-color:var(--brand);background:var(--hover);font-weight:700;color:var(--brand)}
  #toc a .n{color:var(--sub);font-size:12px;margin-right:6px}
  /* 閱讀區 */
  #reader{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .page{max-width:760px;margin:0 auto;padding:44px 48px 100px}
  .cgrp{color:var(--brand2);font-weight:800;letter-spacing:2px;font-size:12.5px}
  .page h1{font-size:26px;margin:6px 0 6px;line-height:1.35;border-bottom:3px solid var(--brand);padding-bottom:16px}
  .page h2{font-size:19px;margin:30px 0 10px;color:var(--brand);display:flex;align-items:center;gap:8px}
  .page h2::before{content:"";width:5px;height:19px;background:var(--brand2);border-radius:2px;flex:0 0 auto}
  .page h3{font-size:16px;margin:20px 0 6px;color:var(--h3)}
  .page p{line-height:1.95;font-size:15.5px;margin:11px 0}
  .page li{line-height:1.9;font-size:15px;margin:4px 0}
  .page ul{padding-left:22px;margin:8px 0}
  .page blockquote{background:var(--card);border-left:4px solid var(--brand2);border-radius:6px;
    padding:12px 16px;margin:14px 0;font-size:15px;line-height:1.85;color:var(--bq)}
  .page table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px;background:var(--card);border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(120,90,40,.06)}
  .page th,.page td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top;line-height:1.7}
  .page th{background:var(--th);color:var(--brand);font-weight:700}
  .page tr:nth-child(even) td{background:var(--card2)}
  .page pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;
    font-family:"SF Mono",Menlo,monospace;font-size:13px;line-height:1.7;overflow-x:auto;color:var(--bq);white-space:pre}
  .page code{background:var(--th);border-radius:4px;padding:1px 6px;font-size:13.5px;color:var(--brand)}
  .page hr{border:0;border-top:1px dashed var(--line);margin:24px 0}
  #toc .tw{display:inline-block;width:14px;color:var(--sub);font-size:11px;margin-right:2px}
  #toc .subtoc{padding:2px 0 8px;background:rgba(0,0,0,.015)}
  #toc a.sub{display:block;padding:6px 18px 6px 40px;font-size:12.5px;line-height:1.45;color:var(--sub);
    border-left:3px solid transparent;cursor:pointer}
  #toc a.sub:hover{background:var(--hover);color:var(--brand)}
  mark{background:transparent;color:var(--trap);font-weight:800;padding:0}
  b{color:var(--strong);font-weight:800}
  .wl{color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent)}
  /* 🔗 跨法對照色欄（有別於粉紅重點、藍色連結） */
  .xlaw{display:block;border-left:3px solid var(--xlaw);background:var(--xlaw-bg);color:var(--xlaw-ink);
    border-radius:6px;padding:6px 11px;margin:7px 0;font-size:13.5px;line-height:1.7;font-weight:600}
  .pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;border-top:1px solid var(--line);padding-top:20px}
  .pager button{flex:1;font-family:inherit;background:var(--btn);color:var(--brand);border:0;border-radius:12px;
    padding:14px 16px;font-size:14px;font-weight:700;cursor:pointer;text-align:left;line-height:1.4}
  .pager button:hover{background:var(--btnh)}
  .pager button:disabled{opacity:.35;cursor:default}
  .pager .lbl{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-bottom:2px}
  .pager .nx{text-align:right}
  #menuBtn{display:none}
  #themeBtn{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:30;
    width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--sidebar);color:var(--brand);
    font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .barwrap{position:sticky;top:0;height:4px;background:var(--line);z-index:5}
  #bar{height:100%;width:0;background:linear-gradient(90deg,var(--brand2),var(--brand))}
  /* 回頂／到底 浮動按鈕 */
  #navFab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:29;display:flex;flex-direction:column;gap:8px}
  #navFab button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--sidebar);color:var(--brand);
    font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .1s,opacity .2s}
  #navFab button:active{transform:scale(.9)}
  /* 詞彙彈窗 */
  .gl{color:var(--accent);font-weight:700;border-bottom:1px dashed var(--accent);cursor:pointer}
  #glmodal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px}
  #glbox{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;max-height:82vh;overflow-y:auto;padding:22px 22px 24px;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  #glbox h3{margin:0 26px 10px 0;color:var(--brand);font-size:17px}
  #glbox p{line-height:1.85;font-size:14.5px;margin:9px 0}
  #glbox p.glnote{color:var(--sub);font-size:13px}
  #glbox table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px;background:var(--card);border-radius:8px;overflow:hidden}
  #glbox th,#glbox td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.6}
  #glbox th{background:var(--th);color:var(--brand)}
  #glbox tr:nth-child(even) td{background:var(--card2)}
  #glclose{position:absolute;top:10px;right:12px;border:0;background:var(--btn);color:var(--brand);width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer}
  @media(max-width:860px){
    #toc{position:fixed;left:-300px;top:0;bottom:0;z-index:20;transition:.25s;box-shadow:2px 0 14px rgba(0,0,0,.12)}
    #toc.open{left:0}
    #menuBtn{display:flex;position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:30;background:var(--brand);color:#fff;
      width:44px;height:44px;border-radius:11px;align-items:center;justify-content:center;font-size:20px;border:0;cursor:pointer}
    .page{padding:calc(60px + env(safe-area-inset-top)) 20px 100px}
  }
  /* 刷題模式 */
  #quizBtn{position:fixed;top:calc(14px + env(safe-area-inset-top));right:66px;z-index:30;
    width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--sidebar);color:var(--brand);
    font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  #quizmodal{display:none;position:fixed;inset:0;z-index:60;background:rgba(17,20,28,.55);align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
  #qzcard{background:#fff;color:#2a2f3a;border-radius:20px;width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:qzin .22s ease}
  @keyframes qzin{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  #qzhead{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eef0f4;font-weight:800;font-size:16px;color:#2a2f3a;background:#fff}
  #qzhead button{background:#f1f3f7;color:#6b7280;border:0;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;transition:background .15s}
  #qzhead button:hover{background:#e5e8ef}
  #qzbody{overflow-y:auto;padding:20px;background:#fafbfd}
  .qzh{color:#2a2f3a;font-size:19px;font-weight:800;margin:2px 0 4px}
  .qzsub{color:#9aa1b0;font-size:13px;margin:0 0 4px}
  .qzlbl{font-weight:800;color:#6b7280;margin:18px 0 9px;font-size:12.5px;letter-spacing:.3px}
  .qzchk{display:flex;flex-wrap:wrap;gap:9px}
  .qzchk label{position:relative;background:#fff;border:1.5px solid #e2e6ee;border-radius:11px;padding:9px 15px;cursor:pointer;font-size:14px;font-weight:600;color:#4b5563;transition:transform .12s, background .14s, border-color .14s, box-shadow .14s;user-select:none}
  .qzchk label:active{transform:scale(.94)}
  .qzchk input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
  .qzchk label:has(input:checked){background:#eef2ff;border-color:#6366f1;color:#4338ca;box-shadow:0 3px 10px rgba(99,102,241,.22)}
  .qzchk label:has(input:checked)::before{content:"✓ ";font-weight:900}
  .qzbtn{display:block;width:100%;margin:12px 0 0;padding:14px;border-radius:13px;border:0;font-size:15.5px;font-weight:800;cursor:pointer;background:#f1f3f7;color:#374151;transition:transform .08s ease, box-shadow .15s, filter .15s}
  .qzbtn.big{background:linear-gradient(135deg,#6366f1,#7c74f5);color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.35)}
  .qzbtn.ghost{background:#fff;color:#6366f1;border:1.5px solid #e2e6ee}
  .qzbtn:active{transform:scale(.97)}
  .qzbtn.big:active{box-shadow:0 2px 8px rgba(99,102,241,.4)}
  @media(hover:hover){.qzbtn.big:hover{filter:brightness(1.06)}.qzbtn.ghost:hover{background:#f6f7fb}}
  .qzbtn.star{background:#fff;color:#b45309;border:1.5px solid #fcd34d}
  .qzbtn.star.on{background:#fffbeb;color:#b45309;border-color:#f59e0b}
  .qzbtn.gold{background:linear-gradient(135deg,#f59e0b,#f6b935);color:#fff;box-shadow:0 6px 18px rgba(245,158,11,.33)}
  .qzpill.save{background:#fef3c7;color:#b45309}
  .qzmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:#9aa1b0;margin-bottom:12px}
  .qzpill{background:#eef2ff;color:#4f46e5;border-radius:20px;padding:3px 11px;font-weight:800;font-size:12px}
  .qzpill.cat{background:#e7f8ee;color:#15803d}
  .qzq-card{background:#fff;border-radius:16px;border-left:5px solid #6366f1;padding:17px 18px;box-shadow:0 2px 14px rgba(30,40,80,.07);margin-bottom:16px}
  .qzq{font-size:16px;font-weight:700;line-height:1.85;color:#232836;margin:0}
  .qzopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:11px 0;padding:14px 15px;border-radius:14px;border:1.5px solid #e6e9f0;background:#fff;color:#2a2f3a;font-size:14.5px;line-height:1.6;cursor:pointer;box-shadow:0 1px 6px rgba(30,40,80,.05);transition:transform .08s ease, box-shadow .15s, background .15s, border-color .15s}
  .qzbadge{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:#eef2ff;color:#6366f1;transition:all .15s}
  .qztext{flex:1}
  .qzmark{flex:0 0 auto;width:23px;height:23px;border-radius:50%;display:none;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
  .qzopt:active:not(.dis){transform:scale(.99)}
  @media(hover:hover){.qzopt:hover:not(.dis){border-color:#6366f1;background:#f7f8ff}}
  .qzopt.dis{cursor:default}
  .qzopt.right{border-color:#22c55e;background:#f0fdf4}
  .qzopt.right .qzbadge{background:#22c55e;color:#fff}
  .qzopt.right .qzmark{display:flex;background:#22c55e}
  .qzopt.wrong{border-color:#ef4444;background:#fef2f2}
  .qzopt.wrong .qzbadge{background:#ef4444;color:#fff}
  .qzopt.wrong .qzmark{display:flex;background:#ef4444}
  .qzres{font-size:16px;font-weight:800;margin:14px 0 8px}
  .qzres.okk{color:#16a34a}.qzres.nok{color:#dc2626}
  .qzexp{background:#f6f7fb;border-left:4px solid #6366f1;border-radius:10px;padding:12px 14px;line-height:1.8;font-size:14px;margin:8px 0;color:#374151}
  .qzexp.sm{font-size:13px}
  .qzscore{font-size:26px;font-weight:900;color:#4f46e5;margin:10px 0}
  .qzscore span{font-size:15px;color:#9aa1b0;font-weight:700}
  .qzwrong{background:#fff;border-radius:12px;padding:13px;margin:10px 0;border:1px solid #e6e9f0;box-shadow:0 1px 6px rgba(30,40,80,.04)}
  .qzwq{font-weight:700;line-height:1.6;margin-bottom:8px;font-size:14px;color:#232836}
  .qzwo{font-size:13px;line-height:1.75;color:#6b7280}
  .qzwo.r{color:#16a34a;font-weight:700}
  .qzmas{display:flex;align-items:flex-start;gap:10px;margin:14px 0;animation:qzpop .28s ease}
  .qzmas .face{font-size:36px;flex:0 0 auto;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
  .qzmas .bub{position:relative;background:#fff;border:1.5px solid #e6e9f0;border-radius:14px;border-top-left-radius:3px;padding:10px 14px;font-size:14px;line-height:1.6;font-weight:700;flex:1;box-shadow:0 2px 8px rgba(30,40,80,.06)}
  .qzmas.ok .bub{border-color:#86efac;color:#15803d;background:#f0fdf4}
  .qzmas.no .bub{border-color:#fca5a5;color:#c2410c;background:#fff7f5}
  @keyframes qzpop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
  .qzsug{background:#f0f3ff;border-left:4px solid #6366f1;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.9;color:#374151}
  /* 申論模式 */
  #essayBtn{position:fixed;top:calc(14px + env(safe-area-inset-top));right:116px;z-index:30;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--sidebar);color:#d97706;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  #essaymodal{display:none;position:fixed;inset:0;z-index:60;background:rgba(17,20,28,.55);align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
  #escard{background:#fff;color:#2a2f3a;border-radius:20px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:qzin .22s ease}
  #eshead{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eef0f4;font-weight:800;font-size:16px;color:#2a2f3a;background:#fff}
  #eshead button{background:#f1f3f7;color:#6b7280;border:0;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer}
  #esbody{overflow-y:auto;padding:20px;background:#fafbfd}
  .es-q{font-size:15.5px;line-height:2.05;color:#232836;background:#fff;border-radius:14px;border-left:5px solid #f59e0b;padding:16px 18px;box-shadow:0 2px 14px rgba(30,40,80,.07);margin-bottom:6px}
  .es-hl1{background:#dbeafe;border-bottom:2.5px solid #3b82f6;padding:1px 2px;border-radius:3px;font-weight:700}
  .es-hl2{background:#dcfce7;border-bottom:2.5px solid #22c55e;padding:1px 2px;border-radius:3px;font-weight:700}
  .es-hl3{background:#fef9c3;border-bottom:2.5px solid #eab308;padding:1px 2px;border-radius:3px;font-weight:700}
  .es-frame{background:#f6f7fb;border-radius:12px;padding:13px 15px;font-size:13.5px;line-height:2;color:#374151}
  .es-ta{width:100%;min-height:130px;border:1.5px solid #e2e6ee;border-radius:12px;padding:12px;font-size:14px;font-family:inherit;line-height:1.85;box-sizing:border-box;resize:vertical;color:#232836}
  .es-hint{background:#fffbeb;border-left:4px solid #f59e0b;border-radius:10px;padding:10px 13px;margin:8px 0;font-size:13.5px;line-height:1.75;color:#713f12}
  .es-rub{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1.5px solid #e2e6ee;border-radius:11px;margin:7px 0;font-size:13.5px;line-height:1.6;cursor:pointer;background:#fff;color:#374151;transition:background .14s,border-color .14s}
  .es-rub.on{background:#f0fdf4;border-color:#86efac;color:#15803d}
  .es-ans{background:#fff;border:1px solid #e6e9f0;border-radius:12px;padding:15px 17px;font-size:13.8px;line-height:2;color:#2a2f3a;white-space:pre-wrap;margin-top:4px}
  details.es-d{margin:12px 0}
  details.es-d>summary{cursor:pointer;font-weight:800;color:#b45309;padding:11px 14px;background:#fffbeb;border:1.5px solid #fcd34d;border-radius:12px;list-style:none;font-size:14px}
  details.es-d>summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<button id="menuBtn" onclick="document.getElementById('toc').classList.toggle('open')">☰</button>
<button id="themeBtn" title="切換深色／淺色" aria-label="切換深色淺色">🌙</button>
<button id="quizBtn" title="刷題" aria-label="刷題" onclick="qzOpen()">🎯</button>
<button id="essayBtn" title="申論練習" aria-label="申論練習" onclick="esOpen()">📝</button>

};
let cur=+(localStorage.getItem(KEY)||0);

/* ---- 深色／淺色主題切換（記住選擇） ---- */
const TKEY="kaben_theme";
const tbtn=document.getElementById('themeBtn');
function applyTheme(t){
  document.body.classList.toggle('dark', t==='dark');
  tbtn.textContent = t==='dark' ? '☀️' : '🌙';
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t==='dark' ? '#14120d' : '#8a5a2b');
}
applyTheme(localStorage.getItem(TKEY)||'light');
tbtn.onclick=()=>{
  const next = document.body.classList.contains('dark') ? 'light' : 'dark';
  localStorage.setItem(TKEY, next);
  applyTheme(next);
};
if(cur<0||cur>=BOOK.length)cur=0;
localStorage.setItem('kaben_subj', subjOfIdx(cur)); /* 開啟時科目對齊最後閱讀章 */

/* ---- 詞彙彈窗開關 ---- */
function openGl(term){const g=window.GLOSSARY&&window.GLOSSARY[term];if(!g)return;document.getElementById('glbody').innerHTML=g;document.getElementById('glmodal').style.display='flex';}
(function(){const glm=document.getElementById('glmodal');
  document.getElementById('glclose').onclick=()=>glm.style.display='none';
  glm.onclick=e=>{if(e.target===glm)glm.style.display='none';};
})();

/* ---- 迷你 Markdown 渲染(支援標題/表格/清單/引言/程式框/粗體/mark/wikilink) ---- */
function inline(s){
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/【([^】]+)】/g,'<mark>$1</mark>');
  s=s.replace(/\[\[([^\]]+)\]\]/g,(m,p)=>'<span class="wl">'+p.split('|').pop()+'</span>');
  s=s.replace(/⟦([^⟧]+)⟧/g,'<span class="xlaw">🔗 $1</span>');
  if(window.GLOSSARY){for(const term in window.GLOSSARY){if(s.indexOf(term)!==-1){s=s.split(term).join('<span class="gl" data-term="'+term+'">'+term+'</span>');}}}
  return s;
}
function mdToHtml(md){
  const L=md.split('\n'); let h='',i=0;
  while(i<L.length){
    let ln=L[i];
    if(ln.trim().startsWith('```')){let b=[];i++;while(i<L.length&&!L[i].trim().startsWith('```')){b.push(L[i]);i++;}i++;h+='<pre>'+b.join('\n').replace(/</g,'&lt;')+'</pre>';continue;}
    if(ln.trim().startsWith('|')&&i+1<L.length&&/^\s*\|[-:\s|]+\|\s*$/.test(L[i+1])){
      const head=ln.split('|').slice(1,-1).map(c=>c.trim());i+=2;const rows=[];
      while(i<L.length&&L[i].trim().startsWith('|')){rows.push(L[i].split('|').slice(1,-1).map(c=>c.trim()));i++;}
      h+='<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';continue;}
    let m;
    if(m=ln.match(/^###\s+(.*)/)){h+='<h3>'+inline(m[1])+'</h3>';i++;continue;}
    if(m=ln.match(/^##\s+(.*)/)){h+='<h2>'+inline(m[1])+'</h2>';i++;continue;}
    if(m=ln.match(/^#\s+(.*)/)){h+='<h1>'+inline(m[1])+'</h1>';i++;continue;}
    if(/^\s*---+\s*$/.test(ln)){h+='<hr>';i++;continue;}
    if(ln.trim().startsWith('>')){let b=[];while(i<L.length&&L[i].trim().startsWith('>')){b.push(L[i].replace(/^\s*>\s?/,''));i++;}h+='<blockquote>'+b.map(inline).join('<br>')+'</blockquote>';continue;}
    if(/^\s*[-*]\s+/.test(ln)||/^\s*\d+\.\s+/.test(ln)){
      let b=[];while(i<L.length&&(/^\s*[-*]\s+/.test(L[i])||/^\s*\d+\.\s+/.test(L[i]))){b.push(L[i]);i++;}
      h+='<ul>'+b.map(x=>'<li>'+inline(x.replace(/^\s*[-*]\s+/,'').replace(/^\s*\d+\.\s+/,''))+'</li>').join('')+'</ul>';continue;}
    if(ln.trim()===''){i++;continue;}
    h+='<p>'+inline(ln)+'</p>';i++;
  }
  return h;
}

function secHeads(md){
  const out=[];md.split('\n').forEach(l=>{const m=l.match(/^##\s+(.*)/);if(m)out.push(m[1]);});return out;
}
function buildTOC(){
  const sk=curSubject(), sub=SUBJECTS.find(s=>s.key===sk)||SUBJECTS[0];
  let html='<div class="subjtabs">'+SUBJECTS.map(s=>`<button class="subjtab ${s.key===sk?'on':''}" data-subj="${s.key}">${s.tab}</button>`).join('')+'</div>';
  html+=`<div class="bk"><h1>${sub.name}</h1><small>${sub.sub}</small></div>`;
  let last=null,n=0;
  chaptersOf(sk).forEach(({c,i})=>{
    n++;
    if(c.grp!==last){html+=`<div class="grp">${c.grp}</div>`;last=c.grp;}
    const hs=secHeads(c.md), on=(i===cur);
    html+=`<a data-i="${i}" class="${on?'on':''}">${hs.length>=2?'<span class="tw">'+(on?'▾':'▸')+'</span>':'<span class="tw"></span>'}<span class="n">${n}</span>${c.title}</a>`;
    if(on&&hs.length>=2){
      html+='<div class="subtoc">'+hs.map((h,si)=>`<a class="sub" data-sec="${si}">${h}</a>`).join('')+'</div>';
    }
  });
  const t=document.getElementById('toc');t.innerHTML=html;
  t.querySelectorAll('.subjtab').forEach(b=>b.onclick=()=>{
    localStorage.setItem('kaben_subj',b.dataset.subj);
    const list=chaptersOf(b.dataset.subj);cur=list.length?list[0].i:0;render();
  });
  t.querySelectorAll('a[data-i]').forEach(a=>a.onclick=()=>{cur=+a.dataset.i;render();document.getElementById('toc').classList.remove('open');});
  t.querySelectorAll('a.sub').forEach(a=>a.onclick=()=>{
    const el=document.getElementById('sec'+a.dataset.sec);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    document.getElementById('toc').classList.remove('open');
  });
}
function render(){
  localStorage.setItem(KEY,cur);
  buildTOC();
  const c=BOOK[cur];const p=document.getElementById('page');
  document.getElementById('reader').scrollTop=0;
  const list=chaptersOf(curSubject()), pos=list.findIndex(x=>x.i===cur);
  const prevI=pos>0?list[pos-1].i:-1, nextI=(pos>=0&&pos<list.length-1)?list[pos+1].i:-1;
  p.innerHTML=`<div class="cgrp">${c.grp}</div>`+mdToHtml(c.md)+
    `<div class="pager">
      <button ${prevI<0?'disabled':''} id="prev"><span class="lbl">← 上一章</span>${prevI>=0?BOOK[prevI].title:''}</button>
      <button ${nextI<0?'disabled':''} id="next" class="nx"><span class="lbl">下一章 →</span>${nextI>=0?BOOK[nextI].title:''}</button>
    </div>`;
  // 指派段落錨點（供左側目錄小節跳段）
  p.querySelectorAll('h2').forEach((h,i)=>h.id='sec'+i);
  // 詞彙可點→彈窗
  p.querySelectorAll('.gl').forEach(el=>el.onclick=()=>openGl(el.dataset.term));
  const pv=document.getElementById('prev'),nx=document.getElementById('next');
  if(pv&&prevI>=0)pv.onclick=()=>{cur=prevI;render();};
  if(nx&&nextI>=0)nx.onclick=()=>{cur=nextI;render();};
}
function rdScroll(dir){const r=document.getElementById('reader');r.scrollTo({top:dir?r.scrollHeight:0,behavior:'smooth'});}
document.getElementById('reader').addEventListener('scroll',e=>{
  const el=e.target;const max=el.scrollHeight-el.clientHeight||1;const pct=el.scrollTop/max*100;
  document.getElementById('bar').style.width=pct+'%';
  // 接近頂端時淡化「回頂」、接近底端時淡化「到底」
  const t=document.getElementById('toTop'),b=document.getElementById('toBottom');
  if(t)t.style.opacity=el.scrollTop<40?'.35':'1';
  if(b)b.style.opacity=el.scrollTop>max-40?'.35':'1';
});
render();

/* ===== 刷題引擎 ===== */
const QUIZ = window.QUIZ || [];
/* ---- 民法分編(範圍)分類：總則/債/物權/親屬/繼承 ---- */
const CIVIL_PARTS=['總則','債','物權','親屬','繼承'];
const CIVIL_OVR={'114#9':'總則','108#1':'總則','110#10':'總則','113#1':'債','114#6':'總則'};
function civilPart(q){
  const key=q.y+'#'+q.n; if(CIVIL_OVR[key])return CIVIL_OVR[key];
  const rng=n=> n<=152?'總則': n<=756?'債': n<=966?'物權': n<=1137?'親屬':'繼承';
  const cnt={};
  [...String(q.e||'').matchAll(/§\s*(\d+)/g)].forEach(m=>{const r=rng(+m[1]);cnt[r]=(cnt[r]||0)+2;});
  [...String(q.q||'').matchAll(/§\s*(\d+)/g)].forEach(m=>{const r=rng(+m[1]);cnt[r]=(cnt[r]||0)+1;});
  let best=null,bv=0;for(const k in cnt){if(cnt[k]>bv){bv=cnt[k];best=k;}}
  if(best)return best;
  const t=String(q.e||'')+String(q.q||'');
  if(/夫妻|婚姻|離婚|財產制|剩餘財產|結婚/.test(t))return'親屬';
  if(/繼承|遺囑|應繼分|特留分|遺產|拋棄繼承|代位繼承/.test(t))return'繼承';
  if(/所有權|抵押|地上權|占有|共有|役權|質權|留置|典權|物權/.test(t))return'物權';
  if(/契約|買賣|租賃|侵權|不當得利|無因管理|連帶|承攬|委任|居間|保證|定金|違約/.test(t))return'債';
  return'總則';
}
const WBKEY='kaben_wrongbook';
function wbGet(){try{return JSON.parse(localStorage.getItem(WBKEY)||'[]')}catch(e){return[]}}
function wbSave(a){localStorage.setItem(WBKEY,JSON.stringify(a))}
function wbAdd(q){const a=wbGet();const id=q.s+q.y+'#'+q.n;if(!a.some(x=>x.s+x.y+'#'+x.n===id)){a.push(q);wbSave(a)}}
/* ⭐ 收藏題庫（答對也能收藏複習） */
const SBKEY='kaben_savebook';
function qzId(q){return q.s+q.y+'#'+q.n}
function sbGet(){try{return JSON.parse(localStorage.getItem(SBKEY)||'[]')}catch(e){return[]}}
function sbSave(a){localStorage.setItem(SBKEY,JSON.stringify(a))}
function sbHas(q){const id=qzId(q);return sbGet().some(x=>qzId(x)===id)}
function sbDel(id){sbSave(sbGet().filter(x=>qzId(x)!==id))}
function sbToggle(){const q=QZ.pool[QZ.idx];const id=qzId(q);const a=sbGet();
  if(a.some(x=>qzId(x)===id)){sbSave(a.filter(x=>qzId(x)!==id));}else{a.push(q);sbSave(a);}
  const btn=document.getElementById('qzsavebtn');if(btn){const on=sbHas(q);btn.className='qzbtn star'+(on?' on':'');btn.textContent=on?'⭐ 已收藏（點擊取消）':'☆ 收藏此題複習';}}
function qzShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function qzEsc(s){return (''+s).replace(/</g,'&lt;')}
function qzFmt(s){return (''+s).replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
const QZMAS_OK=['答對了！就是這個手感 🎉','漂亮，穩穩的 💪','正解！你記住了 ✨','太棒了，繼續保持 🔥','沒錯就是它，手感來了 😎','這題你完全看穿了 👏'];
const QZMAS_NO=['別灰心，現在記起來就賺到了 📝','差一點！這題陷阱很賊 🫣','錯過一次，下次就認得了 👀','沒關係，這題本來就愛坑人 💡','已記進錯題本，它跑不掉了 ✊','冷靜看詳解，下輪扳回來 🧠'];
function qzPick(a){return a[Math.floor(Math.random()*a.length)]}
let QZ=null;
function qzOpen(){document.getElementById('quizmodal').style.display='flex';qzSetup();}
function qzClose(){document.getElementById('quizmodal').style.display='none';}
function qzSetup(){
  const subs=[...new Set(QUIZ.map(q=>q.s))];
  const yrs=[...new Set(QUIZ.map(q=>q.y))].sort((a,b)=>b-a);
  const nb=wbGet().length;const ns=sbGet().length;
  let h='<h2 class="qzh">🎯 刷題設定</h2><p class="qzsub">題庫共 '+QUIZ.length+' 題・選好條件就開始 🚀</p>';
  const tgl=id=>`<span onclick="qzToggleAll('${id}')" style="float:right;font-size:12px;color:#6366f1;cursor:pointer;font-weight:700">全選／清除</span>`;
  h+='<div class="qzlbl">科目（可複選）'+tgl('qzsub')+'</div><div class="qzchk" id="qzsub">'+subs.map(s=>`<label><input type="checkbox" value="${s}" checked> ${s}</label>`).join('')+'</div>';
  if(subs.includes('民法'))h+='<div class="qzlbl">民法範圍（僅篩選「民法」題）'+tgl('qzcpart')+'</div><div class="qzchk" id="qzcpart">'+CIVIL_PARTS.map(p=>`<label><input type="checkbox" value="${p}" checked> ${p}</label>`).join('')+'</div>';
  h+='<div class="qzlbl">年份（可複選）'+tgl('qzyr')+'</div><div class="qzchk" id="qzyr">'+yrs.map(y=>`<label><input type="checkbox" value="${y}" checked> 民${y}</label>`).join('')+'</div>';
  h+='<div class="qzlbl">題數</div><div class="qzchk" id="qznum">'+[10,20,30,0].map(n=>`<label><input type="radio" name="qnum" value="${n}" ${n===10?'checked':''}> ${n===0?'全部':n+'題'}</label>`).join('')+'</div>';
  h+='<button class="qzbtn big" onclick="qzStart()">開始刷題 ▶</button>';
  h+=`<button class="qzbtn ghost" onclick="qzWrongbook()">📕 我的錯題本（${nb}）</button>`;
  h+=`<button class="qzbtn star${ns?' on':''}" onclick="qzSavebook()">⭐ 我的收藏（${ns}）</button>`;
  document.getElementById('qzbody').innerHTML=h;
}
function qzChk(id){return [...document.querySelectorAll('#'+id+' input:checked')].map(i=>i.value)}
function qzToggleAll(id){const b=[...document.querySelectorAll('#'+id+' input')];const allOn=b.every(x=>x.checked);b.forEach(x=>x.checked=!allOn);}
function qzStart(pool){
  if(!pool){
    const subs=qzChk('qzsub'), yrs=qzChk('qzyr').map(Number);
    const cparts=document.getElementById('qzcpart')?qzChk('qzcpart'):CIVIL_PARTS;
    const n=+(document.querySelector('#qznum input:checked')||{value:0}).value;
    pool=QUIZ.filter(q=>subs.includes(q.s)&&yrs.includes(q.y)&&(q.s!=='民法'||cparts.includes(civilPart(q))));
    pool=qzShuffle(pool.slice()); if(n>0)pool=pool.slice(0,n);
  }else{pool=qzShuffle(pool.slice());}
  if(!pool.length){alert('沒有符合條件的題目，請重新勾選。');return;}
  QZ={pool,idx:0,score:0,wrong:[],answered:false};qzQuestion();
}
function qzQuestion(){
  const q=QZ.pool[QZ.idx];QZ.answered=false;
  let h=`<div class="qzmeta"><span class="qzpill">${q.s}</span><span>民${q.y} #${q.n}</span>${q.t?`<span class="qzpill cat">🏷️ ${qzEsc(q.t)}</span>`:''}<span style="margin-left:auto">${QZ.idx+1} / ${QZ.pool.length}</span></div>`;
  h+=`<div class="qzq-card"><div class="qzq">${qzEsc(q.q)}</div></div>`;
  h+='<div>'+q.o.map((o,i)=>`<button class="qzopt" id="qzo${i}" onclick="qzAnswer(${i})"><span class="qzbadge">${'ABCD'[i]}</span><span class="qztext">${qzEsc(o)}</span><span class="qzmark"></span></button>`).join('')+'</div>';
  h+='<div id="qzfb"></div>';
  const b=document.getElementById('qzbody');b.innerHTML=h;b.scrollTop=0;
}
function qzAnswer(i){
  if(QZ.answered)return;QZ.answered=true;
  const q=QZ.pool[QZ.idx];
  document.querySelectorAll('.qzopt').forEach(b=>b.classList.add('dis'));
  const ro=document.getElementById('qzo'+q.a);ro.classList.add('right');const rm=ro.querySelector('.qzmark');if(rm)rm.textContent='✓';
  const ok=i===q.a;
  if(ok){QZ.score++}else{const wo=document.getElementById('qzo'+i);wo.classList.add('wrong');const wm=wo.querySelector('.qzmark');if(wm)wm.textContent='✕';QZ.wrong.push(q);wbAdd(q);}
  const last=QZ.idx===QZ.pool.length-1;
  document.getElementById('qzfb').innerHTML=
    `<div class="qzmas ${ok?'ok':'no'}"><div class="face">🦉</div><div class="bub">${ok?qzPick(QZMAS_OK):qzPick(QZMAS_NO)}</div></div>`+
    `<div class="qzres ${ok?'okk':'nok'}">${ok?'✅ 答對了！':'❌ 答錯了（正解 '+'ABCD'[q.a]+'）'}</div>`+
    `<div class="qzexp"><b>詳解</b>　${qzFmt(q.e)}</div>`+
    `<button id="qzsavebtn" class="qzbtn star${sbHas(q)?' on':''}" onclick="sbToggle()">${sbHas(q)?'⭐ 已收藏（點擊取消）':'☆ 收藏此題複習'}</button>`+
    `<button class="qzbtn big" onclick="qzNext()">${last?'看結果 🏁':'下一題 →'}</button>`;
}
function qzNext(){QZ.idx++;if(QZ.idx>=QZ.pool.length)qzResult();else qzQuestion();}
function qzResult(){
  const n=QZ.pool.length,s=QZ.score,pct=Math.round(s/n*100);
  let msg;
  if(pct===100)msg='滿分！你根本是經紀人本人了 👑';
  else if(pct>=80)msg='穩！這科你快出師了，保持手感 🎯';
  else if(pct>=60)msg='不錯喔，再刷幾輪就穩了 💪';
  else msg='別急，錯題本就是你的寶藏，回去複習再戰 📚';
  let h=`<h2 class="qzh">🏁 結算</h2>`;
  h+=`<div class="qzmas ${pct>=60?'ok':'no'}"><div class="face">🦉</div><div class="bub">${msg}</div></div>`;
  h+=`<div class="qzscore">${s} / ${n}　<span>答對率 ${pct}%</span></div>`;
  if(QZ.wrong.length){
    window.__qzw=QZ.wrong.slice();
    const tops=[...new Set(QZ.wrong.map(q=>q.t||q.s))];
    h+=`<div class="qzsug">📚 <b>建議回去複習：</b>${tops.map(qzEsc).join('、')}</div>`;
    h+='<div class="qzlbl">本次錯題（已存入錯題本）</div>';
    h+=QZ.wrong.map(q=>`<div class="qzwrong"><div class="qzwq">${q.s}民${q.y}#${q.n}　${qzEsc(q.q)}</div><div class="qzexp sm"><b>正解 ${'ABCD'[q.a]}</b>：${qzFmt(q.e)}</div></div>`).join('');
    h+='<button class="qzbtn big" onclick="qzStart(window.__qzw)">只練本次錯題 🔁</button>';
  }else{h+='<div class="qzexp">全部答對，太強了！🎉</div>';}
  h+='<button class="qzbtn ghost" onclick="qzSetup()">← 回設定</button>';
  const b=document.getElementById('qzbody');b.innerHTML=h;b.scrollTop=0;
}
function qzWrongbook(){
  const a=wbGet();
  let h='<h2 class="qzh">📕 我的錯題本</h2>';
  if(!a.length){h+='<div class="qzexp">目前沒有錯題，先去刷題吧！</div>';}
  else{
    h+=`<div class="qzlbl">共 ${a.length} 題</div>`;
    h+=a.map(q=>`<div class="qzwrong"><div class="qzwq">${q.s}民${q.y}#${q.n}　${qzEsc(q.q)}</div>`+
      q.o.map((o,i)=>`<div class="qzwo ${i===q.a?'r':''}">${'ABCD'[i]}. ${qzEsc(o)}</div>`).join('')+
      `<div class="qzexp sm"><b>正解 ${'ABCD'[q.a]}</b>：${qzFmt(q.e)}</div></div>`).join('');
    h+='<button class="qzbtn big" onclick="qzStart(wbGet())">🔁 練習全部錯題</button>';
    h+='<button class="qzbtn ghost" onclick="if(confirm(\'確定清空錯題本？\')){wbSave([]);qzWrongbook();}">🗑️ 清空錯題本</button>';
  }
  h+='<button class="qzbtn ghost" onclick="qzSetup()">← 回設定</button>';
  const b=document.getElementById('qzbody');b.innerHTML=h;b.scrollTop=0;
}
function qzSavebook(){
  const a=sbGet();
  let h='<h2 class="qzh">⭐ 我的收藏</h2>';
  if(!a.length){h+='<div class="qzexp">還沒有收藏任何題目。答題後點「☆ 收藏此題複習」就會存在這裡（答對也能收藏）。</div>';}
  else{
    h+=`<div class="qzlbl">共 ${a.length} 題</div>`;
    h+=a.map(q=>`<div class="qzwrong"><div class="qzwq"><span class="qzpill save">⭐</span> ${q.s}民${q.y}#${q.n}　${qzEsc(q.q)}</div>`+
      q.o.map((o,i)=>`<div class="qzwo ${i===q.a?'r':''}">${'ABCD'[i]}. ${qzEsc(o)}</div>`).join('')+
      `<div class="qzexp sm"><b>正解 ${'ABCD'[q.a]}</b>：${qzFmt(q.e)}</div>`+
      `<button class="qzbtn ghost" style="margin-top:8px;padding:8px;font-size:13px" onclick="sbDel('${qzId(q)}');qzSavebook()">✕ 移除此題</button></div>`).join('');
    h+='<button class="qzbtn gold" onclick="qzStart(sbGet())">🔁 練習全部收藏</button>';
    h+='<button class="qzbtn ghost" onclick="if(confirm(\'確定清空收藏？\')){sbSave([]);qzSavebook();}">🗑️ 清空收藏</button>';
  }
  h+='<button class="qzbtn ghost" onclick="qzSetup()">← 回設定</button>';
  const b=document.getElementById('qzbody');b.innerHTML=h;b.scrollTop=0;
}
</script>
<script>
/* ===== 申論練習引擎 ===== */
const ESSAY = window.ESSAY || [];
let ES = {cur:null, checked:{}};
function esOpen(){document.getElementById('essaymodal').style.display='flex';esMenu();}
function esClose(){document.getElementById('essaymodal').style.display='none';}
function esMark(q){return qzEsc(q).replace(/\{\{(\d+)\|([\s\S]+?)\}\}/g,(m,n,t)=>'<span class="es-hl'+n+'">'+t+'</span>');}
function esMenu(){
  let h='<div class="qzh">📝 申論練習</div><div class="qzsub">歷屆申論題 · 題目拆解 → 答題架構 → 自評得分 → 參考擬答</div>';
  h+='<div class="qzlbl">選擇題目</div>';
  if(!ESSAY.length){h+='<p style="color:#9aa1b0">尚無申論題</p>';}
  ESSAY.forEach((e,i)=>{
    h+='<button class="qzbtn ghost" style="text-align:left;line-height:1.5" onclick="esStart('+i+')"><b>'+qzEsc(e.s)+'・'+e.y+'年 第'+e.n+'題</b>（'+e.pts+'分）<br><span style="font-size:12px;color:#9aa1b0">'+qzEsc(e.topic)+'</span></button>';
  });
  document.getElementById('esbody').innerHTML=h;
}
function esStart(i){
  const e=ESSAY[i]; ES.cur=e; ES.checked={};
  let h='<button class="qzbtn ghost" style="width:auto;padding:7px 14px;margin:0 0 12px" onclick="esMenu()">← 題目清單</button>';
  h+='<div class="qzmeta"><span class="qzpill">'+qzEsc(e.s)+'</span><span class="qzpill cat">'+e.y+'年 第'+e.n+'題</span><span class="qzpill">'+e.pts+'分</span></div>';
  h+='<div class="es-q">'+esMark(e.q)+'</div>';
  h+='<div style="font-size:11.5px;color:#9aa1b0;margin:6px 0 2px">🖍️ 上色處＝題目要你回答的重點（藍＝問1、綠＝問2）</div>';
  h+='<div class="qzlbl">🎨 題目拆解（這題問你這幾件事）</div>';
  e.asks.forEach((a,k)=>{const c=['#3b82f6','#22c55e','#eab308'][k]||'#6366f1';const bg=['#eff6ff','#f0fdf4','#fefce8'][k]||'#eef2ff';
    h+='<div class="es-hint" style="border-color:'+c+';background:'+bg+';color:#1f2937"><b>問'+(k+1)+'：</b>'+qzEsc(a.t)+'<br><span style="font-size:12px;color:#6b7280">👉 '+qzEsc(a.note)+'</span></div>';});
  h+='<div class="qzlbl">🏗️ 答題架構（照骨架由上往下、每行由左至右寫；一、二、三 對應各問）</div><div class="es-frame">'+e.frame.map(f=>qzEsc(f)).join('<br>')+'</div>';
  h+='<div class="qzlbl">✍️ 我的作答（可選·寫完按下方鈕複製給 Claude 批改）</div><textarea id="esta" class="es-ta" placeholder="在這裡擬答…（用 一、二、三 分項作答）"></textarea>';
  h+='<button class="qzbtn ghost" onclick="esCopy()">📋 複製我的作答＋得分點給 Claude 批改</button>';
  h+='<details class="es-d"><summary>💡 卡住了？點開提示方向</summary><div style="padding:2px">'+e.hints.map(x=>'<div class="es-hint">'+qzEsc(x)+'</div>').join('')+'</div></details>';
  h+='<div class="qzlbl">📋 得分點自評（勾選你有寫到的，自動加總）</div><div id="esrub">';
  e.rubric.forEach((r,k)=>{h+='<div class="es-rub" onclick="esTog('+k+')"><span id="esck'+k+'" style="flex:0 0 auto">⬜</span><span style="flex:1">'+qzEsc(r.t)+' <b style="color:#d97706">（'+r.p+'分）</b></span></div>';});
  h+='</div><div class="qzscore" id="esscore" style="color:#d97706">自評：0 <span>／ '+e.pts+' 分</span></div>';
  h+='<details class="es-d"><summary>📖 顯示參考擬答（建議先自己寫完再看）</summary><div class="es-ans">'+qzEsc(e.ans)+'</div></details>';
  document.getElementById('esbody').innerHTML=h;
  document.getElementById('esbody').parentElement.scrollTop=0;
}
function esTog(k){
  ES.checked[k]=!ES.checked[k];
  document.getElementById('esck'+k).textContent=ES.checked[k]?'✅':'⬜';
  document.querySelectorAll('#esrub .es-rub')[k].classList.toggle('on',!!ES.checked[k]);
  let s=0;ES.cur.rubric.forEach((r,i)=>{if(ES.checked[i])s+=r.p;});
  document.getElementById('esscore').innerHTML='自評：'+s+' <span>／ '+ES.cur.pts+' 分</span>';
}
function esCopy(){
  const e=ES.cur, ta=document.getElementById('esta');
  const txt='【請依下列得分點幫我批改這題申論，逐點給分並提供改寫建議】\n科目：'+e.s+'　'+e.y+'年 第'+e.n+'題（'+e.pts+'分）\n\n題目：'+e.q.replace(/\{\{\d+\|([\s\S]+?)\}\}/g,'$1')+'\n\n得分點：\n'+e.rubric.map((r,i)=>(i+1)+'. ('+r.p+'分) '+r.t).join('\n')+'\n\n我的作答：\n'+((ta&&ta.value)||'(未填)');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>alert('已複製！貼到 Claude 對話即可批改 ✅'),()=>esCopyFallback(txt));}
  else esCopyFallback(txt);
}
function esCopyFallback(txt){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('已複製！貼到 Claude 對話即可批改 ✅');}catch(e){alert('複製失敗，請手動選取');}document.body.removeChild(ta);}
</script>
<script>
/* 註冊 Service Worker → 支援離線複習 */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
