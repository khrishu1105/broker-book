<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>土地法與稅法 · 電子參考書</title>
<!-- PWA：可加到手機主畫面、全螢幕開啟、離線複習 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a5a2b">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="經紀人複習">
<style>
  :root{
    --paper:#fbf9f4; --ink:#2b2b2b; --sub:#7a7266; --line:#e7e0d4;
    --brand:#8a5a2b; --brand2:#b07a3c; --accent:#3b5bdb;
    --ok:#16a34a; --ok-bg:#e9f7ee; --bad:#dc2626; --bad-bg:#fdecec;
    --trap:#d6336c; --sidebar:#f3efe6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink);
    display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
  #toc{width:270px;flex:0 0 270px;background:var(--sidebar);border-right:1px solid var(--line);overflow-y:auto;padding:18px 0}
  #toc .bk{padding:0 20px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
  #toc .bk h1{font-size:17px;margin:0 0 3px;letter-spacing:.5px}
  #toc .bk small{color:var(--sub);font-size:12px}
  #toc a{display:block;padding:9px 20px;color:var(--ink);text-decoration:none;font-size:14.5px;border-left:3px solid transparent;cursor:pointer}
  #toc a:hover{background:#ece6d9}
  #toc a.on{border-left-color:var(--brand);background:#ece6d9;font-weight:700;color:var(--brand)}
  #toc a.special{color:var(--accent);font-weight:600}
  #toc .grp{font-size:11px;color:var(--sub);padding:12px 20px 4px;letter-spacing:1px}
  #reader{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .page{max-width:720px;margin:0 auto;padding:38px 34px 90px}
  .chap-no{color:var(--brand2);font-weight:800;letter-spacing:2px;font-size:13px}
  h2.title{font-size:27px;margin:4px 0 22px;border-bottom:3px solid var(--brand);padding-bottom:14px;line-height:1.3}
  .page h3{font-size:18px;margin:26px 0 8px;color:var(--brand);display:flex;align-items:center;gap:8px}
  .page h3::before{content:"";width:6px;height:18px;background:var(--brand2);border-radius:2px}
  .page p{line-height:1.9;font-size:15.5px;margin:10px 0}
  .law{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:12px 16px;margin:14px 0;font-size:14.5px;line-height:1.85}
  .law b{color:var(--brand)}
  table.t{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px;background:#fff;border-radius:8px;overflow:hidden}
  table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  table.t th{background:#efe8da;color:var(--brand);font-weight:700}
  table.t tr:nth-child(even) td{background:#fdfcf9}
  .call{border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14.5px;line-height:1.8}
  .call.tip{background:#eef4ff;border:1px solid #d3e0ff}
  .call.trap{background:#fff0f5;border:1px solid #ffd3e2}
  .call .h{font-weight:800;margin-bottom:4px;display:block}
  .call.tip .h{color:var(--accent)} .call.trap .h{color:var(--trap)}
  mark{background:transparent;color:var(--trap);font-weight:800}
  .u{color:var(--brand);font-weight:700}
  .ladder{margin:16px 0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
  .ladder .row{display:flex;align-items:center;gap:10px;margin:5px 0}
  .ladder .lbl{flex:0 0 150px;font-size:13px;color:var(--sub)}
  .ladder .bar{height:22px;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:4px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:44px}
  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0}
  .flow .b{background:#fff;border:1.5px solid var(--brand2);color:var(--brand);border-radius:8px;padding:8px 12px;font-size:13.5px;font-weight:600}
  .flow .ar{color:var(--brand2);font-weight:800}
  .quiz-launch{margin:30px 0 10px;text-align:center}
  button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;font-weight:700}
  .startbtn{background:var(--brand);color:#fff;font-size:15px;padding:13px 26px}
  .q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
  .q .qh{font-size:12px;color:var(--sub);margin-bottom:8px}
  .q .stem{font-weight:700;font-size:15.5px;margin-bottom:12px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;margin:8px 0;cursor:pointer;font-size:14.5px}
  .opt:hover{background:#faf8f3}
  .opt .k{flex:0 0 24px;height:24px;border-radius:50%;background:#efe8da;color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .k{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);color:#fff}
  .sol{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:none}
  .sol.show{display:block}
  .sol .v{font-weight:800;margin-bottom:8px} .v.y{color:var(--ok)} .v.n{color:var(--bad)}
  .sol .blk{margin:8px 0;font-size:14px}.sol .blk b{color:var(--sub);font-size:12px;display:block;margin-bottom:2px;letter-spacing:.5px}
  .pager{display:flex;justify-content:space-between;margin-top:40px;border-top:1px solid var(--line);padding-top:18px}
  .pager button{background:#efe8da;color:var(--brand);padding:12px 18px;font-size:14px}
  .pager button:disabled{opacity:.4;cursor:default}
  .bankbar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  .bankbar .yc{font-size:12.5px;padding:5px 11px;border-radius:99px;background:#efe8da;color:var(--sub);cursor:pointer}
  .bankbar .yc.on{background:var(--brand);color:#fff;font-weight:700}
  .bankq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin:12px 0}
  .bankq .src{font-size:12px;color:var(--sub);margin-bottom:10px}
  .bankq .txt{white-space:pre-line;line-height:2;font-size:15.5px}
  .lbtns{display:flex;gap:10px;margin:16px 0 4px}
  .lb{flex:1;padding:14px 0;font-size:17px;font-weight:800;background:#f3efe6;color:var(--brand);border:1.5px solid var(--line);border-radius:10px}
  .lb.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .lb.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .bankfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .bankfoot .cnt{font-size:13px;color:var(--sub)}
  #menuBtn{display:none}
  @media(max-width:820px){
    #toc{position:fixed;left:-280px;top:0;bottom:0;z-index:20;transition:.25s;box-shadow:2px 0 12px rgba(0,0,0,.1)}
    #toc.open{left:0}
    #menuBtn{display:flex;position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:30;background:var(--brand);color:#fff;width:44px;height:44px;border-radius:10px;align-items:center;justify-content:center;font-size:20px}
    .page{padding:calc(64px + env(safe-area-inset-top)) 18px 90px}
  }
</style>
</head>
<body>
<div id="menuBtn" onclick="document.getElementById('toc').classList.toggle('open')">☰</div>
<nav id="toc"></nav>
<main id="reader"><div class="page" id="page"></div></main>

<!-- 內容資料（與引擎分離；要擴充只加/改 data/ 裡的檔）-->
<script src="data/土地稅法_課文.js"></script>
<script src="data/土地稅法_題庫.js"></script>

<script>
const Q = window.LT_QUIZ || {};
const BOOK = window.LT_CHAPTERS || [];

const WKEY="book_wrong_v1";
const getWrong=()=>JSON.parse(localStorage.getItem(WKEY)||"[]");
const setWrong=a=>localStorage.setItem(WKEY,JSON.stringify([...new Set(a)]));
const fmt=s=>String(s).replace(/【(.+?)】/g,'<mark>$1</mark>');
let cur=0;

function buildTOC(){
  const w=getWrong().length;
  let last=null,html='<div class="bk"><h1>土地法與土地相關稅法</h1><small>不動產經紀人 · 電子參考書</small></div>';
  BOOK.forEach((c,i)=>{
    if(c.grp!==last){html+=`<div class="grp">${c.grp}</div>`;last=c.grp;}
    html+=`<a data-i="${i}" class="${i===cur?'on':''}">${c.no}　${c.title}</a>`;
  });
  const bn=(window.BANK_LANDTAX||[]).length;
  html+=`<div class="grp">題庫</div>`;
  html+=`<a data-bank="1" class="special ${cur===-2?'on':''}">📚 歷屆題庫（${bn}）</a>`;
  html+=`<a data-w="1" class="special ${cur===-1?'on':''}">⭐ 錯題本${w?`（${w}）`:''}</a>`;
  const toc=document.getElementById('toc');
  toc.innerHTML=html;
  toc.querySelectorAll('a[data-i]').forEach(a=>a.onclick=()=>{cur=+a.dataset.i;render();closeM();});
  toc.querySelector('a[data-w]').onclick=()=>{cur=-1;render();closeM();};
  toc.querySelector('a[data-bank]').onclick=()=>{cur=-2;startBank();closeM();};
}
function closeM(){document.getElementById('toc').classList.remove('open');}

function optHTML(o){return o.map((t,i)=>`<div class="opt" data-i="${i}"><div class="k">${"ABCD"[i]}</div><div>${fmt(t)}</div></div>`).join('');}
function bindQ(el,qid,q){
  let done=false;
  el.querySelectorAll('.opt').forEach(op=>op.onclick=()=>{
    if(done)return;done=true;
    const pick=+op.dataset.i, ok=pick===q.a;
    el.querySelectorAll('.opt').forEach(x=>x.style.cursor='default');
    el.querySelectorAll('.opt')[q.a].classList.add('correct');
    if(!ok){op.classList.add('wrong');const w=getWrong();w.push(qid);setWrong(w);buildTOC();}
    const s=el.querySelector('.sol');
    s.querySelector('.v').className='v '+(ok?'y':'n');
    s.querySelector('.v').textContent=ok?'✓ 答對了':'✗ 答錯了，正解 '+"ABCD"[q.a];
    s.classList.add('show');
  });
}
function questionBlock(qid){
  const q=Q[qid]; if(!q) return '';
  return `<div class="q" data-qid="${qid}">
    <div class="qh">${q.src}</div>
    <div class="stem">${fmt(q.stem)}</div>
    <div class="opts">${optHTML(q.o)}</div>
    <div class="sol"><div class="v"></div>
      <div class="blk"><b>📖 法條依據</b>${fmt(q.law)}</div>
      <div class="blk"><b>💡 生活例子</b>${fmt(q.eg)}</div>
      <div class="blk"><b>⚠️ 文字陷阱</b>${fmt(q.trap)}</div>
    </div></div>`;
}

function render(){
  buildTOC();
  const page=document.getElementById('page');
  document.getElementById('reader').scrollTop=0;
  if(cur===-2){renderBank(page);return;}
  if(cur===-1){
    const w=getWrong();
    page.innerHTML=`<div class="chap-no">複習</div><h2 class="title">⭐ 錯題本</h2>
      ${w.length?`<p>這裡是你在「精選練習」答錯過的題目，訂正到全對再回去讀課文。</p>${w.map(questionBlock).join('')}
      <div class="quiz-launch"><button class="startbtn" onclick="if(confirm('清空錯題本？')){setWrong([]);render();}">清空錯題本</button></div>`
      :`<p>目前沒有錯題 🎉 去各章練習，答錯的會自動收進來。</p>`}`;
    page.querySelectorAll('.q').forEach(el=>bindQ(el,el.dataset.qid,Q[el.dataset.qid]));
    return;
  }
  const c=BOOK[cur];
  page.innerHTML=`<div class="chap-no">${c.no} · ${c.grp}</div><h2 class="title">${c.title}</h2>
    ${c.html}
    ${c.quiz.length?`<div class="quiz-launch"><button class="startbtn" id="startQ">📝 本章精選練習（${c.quiz.length} 題）</button></div>`:``}
    <div id="quizArea"></div>
    <div class="pager">
      <button ${cur===0?'disabled':''} id="prev">← 上一章</button>
      <button ${cur===BOOK.length-1?'disabled':''} id="next">下一章 →</button>
    </div>`;
  const sq=document.getElementById('startQ');
  if(sq)sq.onclick=()=>{
    const area=document.getElementById('quizArea');
    area.innerHTML=c.quiz.map(questionBlock).join('');
    area.querySelectorAll('.q').forEach(el=>bindQ(el,el.dataset.qid,Q[el.dataset.qid]));
    area.scrollIntoView({behavior:'smooth'});
    sq.style.display='none';
  };
  const p=document.getElementById('prev'),n=document.getElementById('next');
  if(p&&cur>0)p.onclick=()=>{cur--;render();};
  if(n&&cur<BOOK.length-1)n.onclick=()=>{cur++;render();};
}

/* ============ 歷屆題庫 自我測驗 ============ */
const BWKEY="book_bank_wrong_v1";
const bankWrong=()=>JSON.parse(localStorage.getItem(BWKEY)||"[]");
const setBankWrong=a=>localStorage.setItem(BWKEY,JSON.stringify([...new Set(a)]));
let bankFilter="all", bankList=[], bankIdx=0, bankAnswered=false, bankScore=0;
function bankAll(){return window.BANK_LANDTAX||[];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function startBank(){
  let src=bankAll();
  if(bankFilter==="wrong"){const w=bankWrong();src=src.filter(q=>w.includes(q.y+"-"+q.n));}
  else if(bankFilter!=="all"){src=src.filter(q=>q.y===+bankFilter);}
  bankList=shuffle(src.slice()); bankIdx=0; bankScore=0; render();
}
function renderBank(page){
  const data=bankAll();
  if(!data.length){page.innerHTML=`<h2 class="title">📚 歷屆題庫</h2><p>題庫檔未載入，請確認 data/土地稅法_題庫.js 存在。</p>`;return;}
  const years=[...new Set(data.map(q=>q.y))].sort((a,b)=>b-a);
  const w=bankWrong().length;
  let bar=`<span class="yc ${bankFilter==='all'?'on':''}" data-f="all">全部 ${data.length}</span>`;
  bar+=`<span class="yc ${bankFilter==='wrong'?'on':''}" data-f="wrong">錯題 ${w}</span>`;
  bar+=years.map(y=>`<span class="yc ${bankFilter==(''+y)?'on':''}" data-f="${y}">${y}年</span>`).join("");
  if(!bankList.length){
    page.innerHTML=`<div class="chap-no">歷屆試題</div><h2 class="title">📚 歷屆題庫</h2><div class="bankbar">${bar}</div><p style="margin-top:20px">此範圍沒有題目 🎉</p>`;
    bindBankBar(page);return;
  }
  if(bankIdx>=bankList.length){
    page.innerHTML=`<div class="chap-no">歷屆試題</div><h2 class="title">📚 完成本輪</h2><div class="bankbar">${bar}</div>
      <p style="margin-top:20px;font-size:20px">得分 <b style="color:var(--brand)">${bankScore} / ${bankList.length}</b></p>
      <div class="quiz-launch"><button class="startbtn" onclick="startBank()">再來一輪</button></div>`;
    bindBankBar(page);return;
  }
  const q=bankList[bankIdx]; bankAnswered=false;
  page.innerHTML=`<div class="chap-no">歷屆試題</div><h2 class="title">📚 歷屆題庫</h2>
    <div class="bankbar">${bar}</div>
    <div class="bankq">
      <div class="src">${q.y}年 · 第 ${q.n} 題 · 土地法與稅法概要</div>
      <div class="txt">${q.t.replace(/</g,'&lt;')}</div>
      <div class="lbtns">${"ABCD".split("").map(L=>`<button class="lb" data-l="${L}">${L}</button>`).join("")}</div>
      <div class="sol" id="bsol"><div class="v"></div></div>
      <div class="bankfoot"><span class="cnt">${bankIdx+1} / ${bankList.length}　答對 ${bankScore}</span>
        <button class="startbtn" id="bnext" style="display:none;padding:10px 20px">下一題 →</button></div>
    </div>`;
  bindBankBar(page);
  page.querySelectorAll('.lb').forEach(b=>b.onclick=()=>{
    if(bankAnswered)return; bankAnswered=true;
    const pick=b.dataset.l, ok=pick===q.ans;
    page.querySelectorAll('.lb').forEach(x=>{if(x.dataset.l===q.ans)x.classList.add('correct');});
    if(ok){bankScore++;}else{b.classList.add('wrong');const wl=bankWrong();wl.push(q.y+"-"+q.n);setBankWrong(wl);}
    const s=page.querySelector('#bsol'); s.classList.add('show');
    s.querySelector('.v').className='v '+(ok?'y':'n');
    s.querySelector('.v').textContent=ok?`✓ 答對，正解 ${q.ans}`:`✗ 答錯，正解 ${q.ans}`;
    page.querySelector('#bnext').style.display='inline-block';
    buildTOC();
  });
  const nx=page.querySelector('#bnext'); if(nx)nx.onclick=()=>{bankIdx++;render();};
}
function bindBankBar(page){
  page.querySelectorAll('.bankbar .yc').forEach(c=>c.onclick=()=>{bankFilter=c.dataset.f;startBank();});
}
render();
</script>
<script>
/* 註冊 Service Worker → 支援離線複習 */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
